<div id="app"><div style="padding:60px 16px;text-align:center;font:18px/1.5 system-ui,sans-serif;color:#555">Loading Scratch Quest…</div></div>
<script>
/* If anything fails while loading, show it instead of a blank page. */
window.onerror = function (msg, src, line) {
  var a = document.getElementById('app');
  if (a && !window.__sqStarted) a.innerHTML = '<div style="max-width:560px;margin:40px auto;padding:16px;font:16px/1.5 system-ui,sans-serif;border:2px solid #d64545;border-radius:12px;background:#fff"><b>Scratch Quest could not start.</b><br>' +
    String(msg).replace(/</g, '&lt;') + (line ? ' (line ' + line + ')' : '') + '<br><br>If you just set it up, one of the HTML files was probably cut off while pasting. In the Apps Script editor, check that the end of each HTML file (Styles, Shots, Engine) matches the end of the file you copied. The last line starts with <code>&lt;script&gt;(window.SQ_PARTS</code>.</div>';
};
</script>
