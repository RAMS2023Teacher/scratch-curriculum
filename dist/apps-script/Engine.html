blish key ideas and details individually or collaboratively in a way that informs, persuades, and/or entertains using a variety of digital tools and media-rich resources.","DTC.b.3":"Demonstrate ability to communicate appropriately through various online tools (e.g., e-mail, social media, texting, blog comments).","CS.a.7":"Identify steps involved in diagnosing and solving routine hardware and software problems (e.g., power, connections, application window or toolbar, cables, ports, network resources, video, sound) that occur during everyday computer use.","CT.a.1":"Describe how data is abstracted by listing attributes of everyday items to represent, order and compare those items (e.g., street address as an abstraction for locations; car make, model, and license plate number as an abstraction for cars).","CT.a.2":"Define a simple function that represents a more complex task/problem and can be reused to solve similar tasks/problems.","CT.b.1":"Design solutions that use repetition and conditionals.","CT.b.2":"Use logical reasoning to predict outputs given varying inputs.","CT.b.3":"Individually and collaboratively, decompose a problem and create a sub-solution for each of its parts (e.g., video game, robot obstacle course, making dinner).","CT.b.4":"Recognize that more than one algorithm can solve a given problem.","CT.b.5":"Recognize that boundaries need to be taken into account for an algorithm to produce correct results.","CT.c.3":"Create, modify, and use a database (e.g., define field formats, add new records, manipulate data), individually and collaboratively, to analyze data and propose solutions for a task/problem.","CT.d.1":"Individually and collaboratively compare algorithms to solve a problem, based on a given criteria (e.g., time, resource, accessibility).","CT.d.2":"Use functions to hide the detail in a program.","CT.d.3":"Create a program, individually and collaboratively, that implements an algorithm to achieve a given goal.","CT.d.4":"Implement problem solutions using a programming language, including all of the following: looping behavior, conditional statements, expressions, variables, and functions.","CT.d.5":"Trace programs step-by-step in order to predict their behavior.","CT.d.6":"Use an iterative approach in development and debugging to understand the dimensions of a problem clearly.","CT.e.1":"Create a model of a real-world system and explain why some details, features and behaviors were required in the model and why some could be ignored.","CT.e.2":"Use and modify simulations to analyze and illustrate a concept in depth (e.g., light rays/mechanical waves interaction with materials, genetic variation)."},practices:{1:"Creating",2:"Connecting",3:"Abstracting",4:"Analyzing",5:"Communicating",6:"Collaborating",7:"Researching"},lessons:{t1:{s:[["CT.d.3","Builds scripts that move, turn, and glide a sprite to target spots."],["CT.b.2","Predicts where a sprite lands from its x and y values (quick check)."],["CAS.a.3","Shares a public project using first name only and no personal info."]],p:[1,2]},t2:{s:[["CT.d.5","Sequence detective: swaps two blocks and traces what changes."],["CT.d.3","Uses event blocks (green flag, keys, clicks) to start scripts."]],p:[1,4]},t3:{s:[["CT.b.1","Uses repeat and forever loops for motion and animation."],["CT.d.1",'Compares the copy-paste "long way" with the loop way.'],["CT.b.4","Solves the same square path two different ways."],["CT.d.4","Looping behavior."]],p:[1,3]},t4:{s:[["CT.b.1","Combines a forever loop with if blocks for maze controls and walls."],["CT.d.4","Conditional statements and sensing (touching color)."],["CT.d.6","A neighbor playtests the maze, then the student fixes one thing."]],p:[1,6]},t5:{s:[["CT.d.4","Variables, comparisons, if/else, and broadcasts in one virtual-pet program."],["CT.b.1","A forever loop with if/else decides the pet's mood."],["CT.b.2","Predicts results of set vs. change, and of comparisons like 4 < 4."],["CT.b.5","Caps energy at 10 and stops at 0, handling the edges of the value."]],p:[1,3]},g1:{s:[["CT.d.4","Variables and expressions: a score that goes up and down."],["CT.b.1","Loops and conditionals decide when to add or take away points."],["CT.d.6","Plays three rounds and tunes the speed."]],p:[1,4]},g2:{s:[["CT.b.3","Breaks the game into parts: clone spawner, clone behavior, timer, Game Over."],["CT.d.4","Variables for time and speed, with loops and conditionals."],["CT.d.6","Playtests full rounds and tunes the numbers."]],p:[1,3]},s1:{s:[["CT.b.4","Times a conversation two ways: the wait method and the broadcast method."],["CT.d.3","Plans six lines of dialogue on paper, then codes them."],["DTC.b.1","Tells an entertaining animated story."]],p:[1,5]},s2:{s:[["CT.b.3","Splits the story into three scenes and codes each one."],["DTC.b.1","Publishes a multi-scene animated story."],["CT.d.6","Watches the story twice to check that it resets correctly."]],p:[1,5]},a1:{s:[["CT.d.4","Variables (name), expressions (join, =), and if/else."],["CT.b.2","The chatbot gives different answers for different inputs."],["CT.b.5","A friend tests the bot and the student fixes unexpected answers."]],p:[1,6]},a2:{s:[["CT.b.3","Breaks the quiz app into buttons, question tracking, and a results screen."],["CT.d.4","Score and question variables with conditional answer checks."],["DTC.b.1","A quiz that informs users about a topic the student knows."]],p:[1,5]},m1:{s:[["CT.d.5","Traces four buggy scripts block by block, then reads and explains an unfamiliar classmate project."],["CT.b.2","Code Reader: predicts what a change will do before running it."],["CT.d.6","Uses a test, change, test-again debugging cycle."],["CS.a.7","Follows a step-by-step troubleshooting routine and writes a bug report."]],p:[4,6]},m2:{s:[["CT.a.2","Makes reusable custom blocks such as dance and square of any size."],["CT.d.2","Hides repeated detail inside My Blocks."],["CT.d.4","Functions with inputs."]],p:[3,1]},g3:{s:[["CT.e.1","Simulates gravity with a velocity variable. The teacher-led wrap-up asks what real physics the model leaves out."],["CT.e.2","Changes gravity and jump values and studies how movement changes."],["CT.d.4","A y speed variable with loops and conditionals."]],p:[3,1]},g4:{s:[["CT.b.3","Breaks the game into levels, doors, lives, win/lose screens, and high score."],["CT.d.4","Variables for lives, score, and high score."],["CT.d.6","Playtests the whole game from start to finish."]],p:[1,4]},s3:{s:[["CT.b.3","Maps a branching story, then builds each path."],["CT.b.1","Conditionals send the story down each path."],["CT.d.6","Tests every path to check that nothing gets stuck."]],p:[1,3]},s4:{s:[["DTC.a.3","Combines recorded audio, music, sound effects, and images in one project."],["DTC.b.1","Uses sound and visual effects to set mood and entertain."]],p:[1,5]},a3:{s:[["CT.c.3",'Builds a small list "database" and adds new records (cards) from the app.'],["CT.a.1","Represents a flashcard by its attributes: question and answer."],["CT.d.4","Lists with loops and a variable that counts through cards."]],p:[3,1]},a4:{s:[["CT.d.3","Builds a working paint tool from a goal (brush, colors, sizes, clear)."],["CT.b.3","Breaks the app into Study and Sketch modes with a menu."],["CT.d.4","Variables and conditionals for brush settings."]],p:[1,3]},f1:{s:[["CT.d.6","Turns playtest feedback into a fix list, then fixes and retests."],["DTC.b.1","Writes instructions and credits so others can use the project."]],p:[4,6,5]},f2:{s:[["CT.b.3","Breaks an example game into features and blocks with the class, then decomposes their own idea the same way."],["CT.d.3","Builds a program toward a stated goal: the MVP."],["CT.d.4","The challenge combines loops, conditionals, variables, and a custom block."]],p:[1,4]},f3:{s:[["CT.d.3","Mystery Mission exit ticket: builds a new mini-program from a written spec with no help."],["DTC.b.1","Publishes and presents a finished project in a one-minute pitch."],["DTC.b.3","Leaves kind, specific Glow comments on classmates' projects."],["CAS.a.4","Practices netiquette in the class studio (challenge)."]],p:[5,6]}}},SQ_UBD={unit:{eus:["Computers follow instructions exactly, so precise and well-ordered code produces predictable results.","Complex programs are built from a few simple ideas: sequence, events, loops, conditionals, variables, and abstraction.","Programming is an iterative process of designing, testing, debugging, and improving, often with feedback from others.","Code is a creative tool: people use it to tell stories, make games, and build apps that matter to them and others."],eqs:["How can we use code to bring our ideas to life?","How do programmers break big problems into smaller ones they can solve?","What do good creators do when something does not work?","How does technology shape the way we create, learn, and share?"]},lessons:{t1:{eq:"How do we give a computer exact directions?",eu:"Computers follow instructions exactly, so precise directions, like x and y positions, control exactly what happens."},t2:{eq:"How does a program know when to act?",eu:"Programs react to events like clicks and key presses, and the order of instructions changes the result."},t3:{eq:"Why do programmers avoid repeating themselves?",eu:"Loops repeat a few instructions to make patterns and animation, so programs stay short and easy to change."},t4:{eq:"How can a program make decisions?",eu:"Programs use conditions to check what is happening and choose what to do next."},t5:{eq:"How does a program remember and share information?",eu:"Variables store information that can change, and messages let different parts of a program work together."},g1:{eq:"What makes a game feel fair and fun?",eu:"A game is rules turned into code: variables track progress, and conditions decide when the score changes."},g2:{eq:"How can one set of instructions control many objects?",eu:"Clones let one script create and control many copies, so a program can grow without more code."},s1:{eq:"How do stories and programs both depend on timing and sequence?",eu:"Timing and messages coordinate characters, the same way a script coordinates actors on a stage."},s2:{eq:"How do we break a big project into parts we can manage?",eu:"Breaking a project into scenes or parts (decomposition) makes complex work easier to build, test, and fix."},a1:{eq:"How do programs listen and respond to people?",eu:"Programs take input, store it, and use it to respond differently to different people."},a2:{eq:"How does an app decide whether something is right?",eu:"Apps compare what a user does to what they expect, give feedback, and keep track of results with variables."},m1:{eq:"What do good problem solvers do when something does not work?",eu:"Bugs are a normal part of creating; testing, tracing code step by step, and reading carefully are how we find and fix them."},m2:{eq:"How can we make complicated programs simpler?",eu:"Abstraction lets us package steps into our own blocks, hiding detail so ideas can be reused."},g3:{eq:"How can we model the real world with code?",eu:"Simulations imitate the real world with simplified rules; a good model keeps what matters and leaves out the rest."},g4:{eq:"How do designers keep players challenged?",eu:"Big games are built from smaller systems (levels, lives, scoring) that work together."},s3:{eq:"How do choices change what a program does?",eu:"Conditionals create branching paths, so a user’s decisions shape what happens next."},s4:{eq:"How do sound and visuals change how people experience a story?",eu:"Combining media like sound, music, and visual effects communicates mood and meaning beyond words."},a3:{eq:"How do programs organize lots of information?",eu:"Lists keep collections of data in order so a program can add to them, search them, and loop through them."},a4:{eq:"How do digital tools turn ideas into creations?",eu:"The tools we use every day are programs too; their features come from code that responds to the user."},f1:{eq:"How does feedback make our work better?",eu:"Creators improve their work through testing, feedback from others, and revision."},f2:{eq:"How do creators turn a big idea into something real?",eu:"Planning, breaking an idea into features, and building in small tested steps make big projects possible."},f3:{eq:"Why do we share what we create?",eu:"Sharing and explaining our work helps others learn and helps us reflect on how we have grown."}}},SQ_PRIMERS={clones:{taughtIn:["g2"],title:"Clones: copies of a sprite",icon:"🐑",short:"A sprite can make copies of itself called clones.",text:"<b>create clone of myself</b> makes a copy. Each copy runs the <b>when I start as a clone</b> script. <b>delete this clone</b> removes a copy when you are done with it. Tip: the original sprite usually hides, and only the clones show.",blocks:"when green flag clicked\nhide\nrepeat (5)\ncreate clone of (myself v)\nwait (1) seconds\nend\n\nwhen I start as a clone\ngo to x: (pick random (-200) to (200)) y: (150)\nshow\nglide (2) secs to x: (x position) y: (-150)\ndelete this clone"},askAnswer:{taughtIn:["a1"],title:"Ask and answer",icon:"💬",shots:["ask"],short:"Ask a question, and the typed answer goes into the answer block.",text:"In <b>Sensing</b>, <b>ask and wait</b> shows a box where the user types. Whatever they type is saved in the round <b>answer</b> block. Use answer anywhere a word or number can go.",blocks:"when green flag clicked\nask [What is your favorite food?] and wait\nsay (answer) for (2) seconds"},join:{taughtIn:["a1"],title:"Join words together",icon:"🔗",shots:["cat-operators"],short:"Join sticks two pieces of text together into one.",text:"<b>join</b> is in <b>Operators</b> (green). It glues two things into one piece of text, like a greeting and a name. Remember to type a space at the end of the first part!",blocks:"say (join [Hello, ] (answer)) for (2) seconds"},lists:{taughtIn:["a3"],title:"Lists hold many things",icon:"📋",shots:["make-list"],short:"A list is a variable that holds many items in order.",text:"In <b>Variables</b>, click <b>Make a List</b>. <b>add thing to list</b> puts an item at the end. <b>item 1 of list</b> reads one item. <b>length of list</b> tells how many items there are.",blocks:"when green flag clicked\ndelete all of [snacks v]\nadd [apple] to [snacks v]\nadd [pizza] to [snacks v]\nsay (item (1) of [snacks v]) for (2) seconds"},pen:{taughtIn:["m2"],title:"The Pen draws lines",icon:"🖊️",shots:["extensions"],short:"Add the Pen extension, then pen down draws wherever the sprite moves.",text:"Click <b>Add Extension</b> (bottom left) and choose <b>Pen</b>. <b>pen down</b> starts drawing as the sprite moves. <b>pen up</b> stops. <b>erase all</b> clears the drawing.",blocks:"when green flag clicked\nerase all\npen down\nrepeat (4)\nmove (100) steps\nturn cw (90) degrees\nend\npen up"},customBlocks:{taughtIn:["m2"],title:"Make your own block",icon:"🧩",shots:["make-block"],short:"In My Blocks, Make a Block turns many blocks into one.",text:"Click <b>My Blocks</b>, then <b>Make a Block</b>. Give it a name. Put blocks under the <b>define</b> hat. Now you can use your block like any other block. It only works in the sprite where you made it.",blocks:"define spin\nrepeat (36)\nturn cw (10) degrees\nend\n\nwhen green flag clicked\nspin"},random:{taughtIn:["g1"],title:"Pick a random number",icon:"🎲",shots:["cat-operators"],short:"Pick random gives a surprise number each time.",text:"<b>pick random 1 to 10</b> is in <b>Operators</b>. Every time it runs, it picks a new number between the two numbers. It is great for random positions and surprises.",blocks:"go to x: (pick random (-200) to (200)) y: (0)"},math:{taughtIn:["g2"],title:"Math blocks",icon:"➗",shots:["cat-operators"],short:"The green Operators blocks can add, subtract, multiply, and divide.",text:'Drop a variable into a math block to do math with it. A handy trick: <b>0 minus speed</b> gives the opposite of speed, so 5 becomes -5. That is how you turn "up" into "down".',blocks:"set [speed v] to (5)\nchange y by ((0) - (speed))"},textStrings:{taughtIn:["a1"],title:"Variables can hold words",icon:"🔤",short:"A variable can hold a word, not only a number.",text:"You can <b>set</b> a variable to a word, like <i>cave</i> or <i>Sam</i>. Then compare it with <b>=</b>. Capital letters do not matter, but extra spaces do: <i>cave </i> with a space is not the same as <i>cave</i>.",blocks:"set [scene v] to [cave]\nif <(scene) = [cave]> then\nsay [It is dark in here!]\nend"}},SQ_SHOT_INFO={tour:"The four parts of Scratch",xy:"The x and y boxes under the Stage","green-flag":"The green flag starts your project","cat-events":"Events blocks (yellow)","cat-sound":"Sound blocks (pink)","cat-control":"Control blocks (orange)","cat-looks":"Looks blocks (purple)","cat-operators":"Operators blocks (green)","touching-color":"The touching color block in Sensing",ask:"The ask and wait block in Sensing","make-variable":"Make a Variable (in Variables)","make-list":"Make a List (in Variables)","make-block":"Make a Block (in My Blocks)",extensions:"The Add Extension button (bottom left)","choose-sprite":"Hover the cat button to pick or paint a sprite","delete-sprite":"The trash can deletes a sprite","costumes-tab":"The Costumes tab","sounds-tab":"The Sounds tab, and the button to add or record a sound","select-stage":"Click the Stage (bottom right)",backdrops:"Then click the Backdrops tab"},SQ_API=function(){if("undefined"!=typeof google&&google.script&&google.script.run){var e=Promise.resolve(),t={},a=/simultaneous|too many|BUSY|lock|try again later|invoked too many|quota/i,s=function(e){try{window.dispatchEvent(new CustomEvent("sq-busy",{detail:e}))}catch(e){}},n=function(e,t,i){return function(e,t){return new Promise(function(a,s){google.script.run.withSuccessHandler(a).withFailureHandler(function(e){s(new Error(e&&e.message||String(e)))}).api(e,t||{})})}(e,t).catch(function(r){if(i<5&&a.test(r.message))return s(!0),new Promise(function(e){setTimeout(e,
